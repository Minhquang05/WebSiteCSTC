<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout}">
<head>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <title>Danh Sách Bác Sĩ</title>
</head>
<body>
<section layout:fragment="content" class="container mt-5">
    <div class="container">
        <h2 class="mt-4 mb-4 text-center">DANH SÁCH BÁC SĨ</h2>
        <a sec:authorize="hasAnyAuthority('ADMIN')" href="/doctors/add" class="btn btn-primary mb-3">Thêm Bác Sĩ Mới</a>
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
            <tr>
                <th>Mã bác sĩ</th>
                <th>Tên bác sĩ</th>
                <th>Số Điện Thoại</th>
                <th>Email</th>
                <th>Trạng thái</th>
                <th>Chức năng</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="doctor : ${doctors}">
                <td th:text="${doctor.id}"></td>
                <td th:text="${doctor.name}"></td>
                <td th:text="${doctor.phone}"></td>
                <td th:text="${doctor.email}"></td>
                <td>
                    <span th:if="${doctor.isRemoved == 0}" class="badge bg-success">Hoạt động</span>
                    <span th:if="${doctor.isRemoved == 1}" class="badge bg-danger">Đã khóa</span>
                </td>
                <td>
                    <a sec:authorize="hasAnyAuthority('DOCTOR')"
                       th:href="@{/doctors/schedule/{id}(id=${doctor.id})}"
                       class="btn btn-warning btn-sm">Sửa Giờ Làm Việc</a>
                    <a th:href="@{/doctors/detail/{id}(id=${doctor.id})}"
                       class="btn btn-warning btn-sm">Chi tiết</a>
                    <a th:href="@{/doctors/edit/{id}(id=${doctor.id})}"
                       class="btn btn-success btn-sm">Chỉnh Sửa</a>

                    <a th:if="${doctor.isRemoved == 0}"
                       th:href="@{/doctors/block/{id}(id=${doctor.id})}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn khóa bác sĩ này không?')">Khóa</a>

                    <a th:if="${doctor.isRemoved == 1}"
                       th:href="@{/doctors/unblock/{id}(id=${doctor.id})}"
                       class="btn btn-success btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn mở khóa bác sĩ này không?')">Mở khóa</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
